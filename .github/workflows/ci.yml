name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest --cov=word_session --cov-report=term-missing
      - name: Build the bundle
        run: powershell -ExecutionPolicy Bypass -File packaging/build.ps1
      - name: Smoke-test the bundle
        run: powershell -ExecutionPolicy Bypass -File packaging/smoke_test.ps1 -Dist dist\WordSession
      - uses: actions/upload-artifact@v4
        with:
          name: WordSession-win64
          path: dist/WordSession-*-win64.zip

  checks-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run pytest -m "not word and not ui"
